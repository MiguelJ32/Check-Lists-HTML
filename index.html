<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Checklists - Tablet</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans p-4 min-h-screen">

    <div class="max-w-4xl mx-auto space-y-4">
        <!-- Encabezado y Buscador -->
        <div class="bg-white p-4 rounded-xl shadow-md border border-slate-200">
            <h1 class="text-xl font-bold text-slate-800 mb-3">🔍 Buscador de Checklists</h1>
            <input type="text" id="searchInput" oninput="debounceBuscar()" placeholder="Escriba SO, VCP, Máquina o No. Parte..." 
                   class="w-full text-lg p-3 border-2 border-slate-300 rounded-lg focus:outline-none focus:border-blue-600">
        </div>

        <!-- Contenedor Principal -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- Columna de Coincidencias -->
            <div class="md:col-span-2 bg-white p-4 rounded-xl shadow-md border border-slate-200 min-h-[400px]">
                <h2 class="font-bold text-slate-700 mb-2">Seleccione un Número de Parte</h2>
                <div id="resultsContainer" class="space-y-2 max-h-[500px] overflow-y-auto">
                    <p class="text-slate-400 text-sm">Ingrese un término para comenzar la búsqueda.</p>
                </div>
            </div>

            <!-- Panel de Control e Impresión -->
            <div class="bg-white p-4 rounded-xl shadow-md border border-slate-200 flex flex-col justify-between">
                <div class="space-y-4">
                    <h2 class="font-bold text-slate-700 border-b pb-2">📋 Configuración de Impresión</h2>
                    
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">IP / Host Servidor Local:</label>
                        <input type="text" id="serverIp" value="http://localhost:5000" class="w-full p-2 text-sm border rounded">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Impresora:</label>
                        <select id="printerSelect" class="w-full p-2 text-sm border rounded bg-slate-50"></select>
                    </div>
                </div>

                <div class="pt-4">
                    <button id="btnPrint" onclick="enviarImpresion()" disabled 
                            class="w-full py-4 bg-emerald-600 text-white font-bold text-lg rounded-xl shadow opacity-50 cursor-not-allowed">
                        🖨️ Mandar a Imprimir
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Selección de Checklists -->
    <div id="checklistModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-lg w-full p-6 space-y-4">
            <h3 class="text-lg font-bold border-b pb-2" id="modalTitle">Seleccionar Checklists</h3>
            <div id="modalList" class="space-y-2 max-h-60 overflow-y-auto"></div>
            <div class="flex justify-end space-x-2 pt-2">
                <button onclick="cerrarModal()" class="px-4 py-2 bg-slate-200 font-bold rounded">Cancelar</button>
                <button onclick="confirmarSeleccion()" class="px-4 py-2 bg-emerald-600 text-white font-bold rounded">Confirmar</button>
            </div>
        </div>
    </div>

    <script>
        let selectedPdfs = [];
        let timer = null;

        function getApiUrl() {
            return document.getElementById('serverIp').value.replace(/\/$/, "");
        }

        async function cargarImpresoras() {
            try {
                const res = await fetch(`${getApiUrl()}/api/impresoras`);
                const impresoras = await res.json();
                const select = document.getElementById('printerSelect');
                select.innerHTML = impresoras.map(p => `<option value="${p}">${p}</option>`).join('');
            } catch (e) { console.error("Error al cargar impresoras", e); }
        }

        function debounceBuscar() {
            clearTimeout(timer);
            timer = setTimeout(ejecutarBusqueda, 300);
        }

        async function ejecutarBusqueda() {
            const query = document.getElementById('searchInput').value.trim();
            const container = document.getElementById('resultsContainer');
            if (!query) { container.innerHTML = ''; return; }

            try {
                const res = await fetch(`${getApiUrl()}/api/buscar?q=${encodeURIComponent(query)}`);
                const data = await res.json();
                
                if (data.length === 0) {
                    container.innerHTML = '<p class="text-slate-400 text-sm">Sin coincidencias.</p>';
                    return;
                }

                container.innerHTML = data.map(item => `
                    <div onclick="seleccionarNoParte('${item.no_parte}')" 
                         class="p-3 border rounded-lg hover:bg-slate-50 cursor-pointer flex justify-between items-center transition">
                        <span class="font-bold text-slate-800">${item.no_parte}</span>
                        <span class="text-xs bg-slate-200 px-2 py-1 rounded">${item.so}</span>
                        <span class="text-xs bg-slate-200 px-2 py-1 rounded">${item.vcp}</span>
                        <span class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded">${item.maquina}</span>
                    </div>
                `).join('');
            } catch (e) { container.innerHTML = '<p class="text-red-500 text-sm">Error de conexión con el servidor local.</p>'; }
        }

        async function seleccionarNoParte(noParte) {
            try {
                const res = await fetch(`${getApiUrl()}/api/checklists?no_parte=${encodeURIComponent(noParte)}`);
                const pdfs = await res.json();
                
                if(pdfs.length === 0) { alert("No se encontraron checklists para este número de parte."); return; }

                const modalList = document.getElementById('modalList');
                modalList.innerHTML = pdfs.map((pdf, idx) => `
                    <label class="flex items-center space-x-2 p-2 border rounded">
                        <input type="checkbox" value="${pdf.ruta}" checked class="pdf-chk h-5 w-5">
                        <span class="text-sm font-medium text-slate-700">${pdf.nombre}</span>
                    </label>
                `).join('');

                document.getElementById('checklistModal').classList.remove('hidden');
                document.getElementById('checklistModal').classList.add('flex');
            } catch (e) { alert("Error al consultar checklists."); }
        }

        function cerrarModal() {
            document.getElementById('checklistModal').classList.add('hidden');
            document.getElementById('checklistModal').classList.remove('flex');
        }

        function confirmarSeleccion() {
            const chks = document.querySelectorAll('.pdf-chk:checked');
            selectedPdfs = Array.from(chks).map(c => c.value);
            cerrarModal();

            const btn = document.getElementById('btnPrint');
            if (selectedPdfs.length > 0) {
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        async function enviarImpresion() {
            const printer = document.getElementById('printerSelect').value;
            const res = await fetch(`${getApiUrl()}/api/imprimir`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ rutas: selectedPdfs, impresora: printer, color: false })
            });
            const data = await res.json();
            if (data.success) { alert("¡Trabajos enviados a impresión correctamente!"); }
            else { alert("Error al mandar a imprimir: " + data.error); }
        }

        window.onload = cargarImpresoras;
    </script>
</body>
</html>
